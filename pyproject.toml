[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoshop-offline-mcp"
version = "0.3.0"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "JonathanChan-geek"}]
description = "H3U offline project tools with version-bound native compiler"
requires-python = ">=3.10"
dependencies = ["mcp==2.2.0", "pefile==2024.8.26"]

[project.urls]
Repository = "https://github.com/JonathanChan-geek/autoshop-mcp"
Issues = "https://github.com/JonathanChan-geek/autoshop-mcp/issues"

[project.scripts]
autoshop-mcp = "autoshop_mcp.__main__:main"
autoshop-offline = "autoshop_mcp.__main__:main"
autoshop-offline-mcp = "autoshop_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoshop_mcp = ["native/*"]
